name: Regenerate site data

# When any itinerary Markdown (or a generator script) changes on main:
#   1. re-stamp places.md with which day each place is visited (annotate_places.py)
#   2. rebuild docs/data.js (generate_site_data.py)
# and commit both back so the repo's generated data stays in sync. The bot push
# uses GITHUB_TOKEN, which does not re-trigger this (or the deploy) workflow.
on:
  push:
    branches: [main]
    paths:
      - 'itinerary.md'
      - 'passes.md'
      - 'places.md'
      - 'days/*.md'
      # every other Markdown that generate_site_data.py reads — without these a
      # content edit would ship a stale docs/data.js
      - 'packing.md'
      - 'dmz.md'
      - 'cards/*.md'
      - 'annotate_places.py'
      - 'generate_site_data.py'
      - 'generate_brief.py'
      # asset edits change their content hash → re-stamp index.html
      - 'docs/app.js'
      - 'docs/style.css'
      - 'docs/firebase-config.js'

permissions:
  contents: write

concurrency:
  group: regen-data
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # brief.txt keys off "today"; match the daily cron's timezone (see
    # refresh-brief.yml for why Asia/Taipei and not Asia/Seoul).
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Annotate places.md with visit days
        run: python annotate_places.py --write

      - name: Regenerate docs/data.js + docs/data.json
        run: python generate_site_data.py

      - name: Regenerate docs/brief.txt
        run: python generate_brief.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain places.md docs/data.js docs/data.json docs/brief.txt docs/index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add places.md docs/data.js docs/data.json docs/brief.txt docs/index.html
            git commit -m "chore: annotate places.md visit days + regenerate data.js, data.json, brief.txt"
            git push
          else
            echo "places.md and the generated docs/ files are already up to date — nothing to commit."
          fi
